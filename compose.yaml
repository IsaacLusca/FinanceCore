name: financecore

services:
  db:
    image: postgres:17-alpine
    container_name: financecore-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financecore}
      POSTGRES_USER: ${POSTGRES_USER:-financecore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - financecore-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  financecore-pgdata:
