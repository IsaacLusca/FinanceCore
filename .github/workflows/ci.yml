name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FinanceCore.slnx

      - name: Build
        run: dotnet build FinanceCore.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test FinanceCore.slnx --configuration Release --no-build --collect:"XPlat Code Coverage" --logger "console;verbosity=normal"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: "**/TestResults/**/coverage.cobertura.xml"
          if-no-files-found: ignore
